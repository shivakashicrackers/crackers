<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shivakashi Crackers – Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#220410;--wine:#4a0a1c;--wine-mid:#5e1328;
  --gold:#c9a24d;--gold-lt:#efd9a0;--gold-dk:#9d7a2f;
  --foil:linear-gradient(135deg,#f6e3a8 0%,#d8b25a 34%,#b88a35 62%,#ecd48c 100%);
  --ivory:#faf6ee;--paper:#fffdf8;--hair:#e3d5b6;
  --price:#6e1030;--green:#2c6a48;--ink:#2e0914;--mute:#7d6e68;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:Jost,"Noto Sans Kannada","Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--serif);margin:0}
button{font-family:inherit}

/* ---------- top strip + header ---------- */
.strip{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--night);color:var(--gold-lt);padding:12px 10px;font-size:11px;font-weight:400;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;border-bottom:1px solid rgba(201,162,77,.3)}
.strip svg{width:20px;height:14px;flex:none;color:var(--gold)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 18px 14px;background:linear-gradient(180deg,#3d0816,#2e0714);border-bottom:1px solid var(--gold)}
.logo{text-align:center;font-size:clamp(38px,12.5vw,66px);font-weight:600;line-height:.95;letter-spacing:.01em;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
.logo .sub{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;font-family:var(--sans);font-size:clamp(10px,3vw,13px);font-weight:500;letter-spacing:.55em;text-indent:.55em;color:var(--gold-lt);-webkit-text-fill-color:var(--gold-lt)}
.logo .sub::before,.logo .sub::after{content:"";height:1px;width:clamp(16px,7vw,40px);background:var(--gold)}
.acts{display:flex;gap:18px;justify-self:end}
.ib{position:relative;background:none;border:0;padding:4px;color:var(--gold-lt);cursor:pointer;line-height:0}
.ib svg{width:26px;height:26px}
.badge{position:absolute;top:-4px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--foil);color:var(--night);font:600 10.500px/17px var(--sans);text-align:center}

/* ---------- hero banner (image) ---------- */
.diwali-hero{display:flex;justify-content:center;width:100%;background:#3d0a12;border-bottom:1px solid var(--gold)}
.diwali-hero .frame{position:relative;width:100%;max-width:1040px;overflow:hidden}
.diwali-hero img{display:block;width:100%;height:auto}
.diwali-hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* wide screens: keep the banner a sensible height and melt its edges into the page */
@media(min-width:1041px){.diwali-hero .frame{-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}}
/* phones: the banner is very wide, so enlarge it and crop the sides to keep the headline readable */
@media(max-width:700px){.diwali-hero img{width:174%;max-width:none;margin-left:-37%}}
#hint{display:block;margin:0;padding:9px 16px;text-align:center;font-size:13px;font-weight:500;letter-spacing:.08em;background:var(--foil);color:var(--night)}
#hint:empty{display:none}
.noprice #hint{display:none}

.notice{background:var(--paper);border-bottom:1px solid var(--hair);color:#5c4a40;text-align:center;padding:16px 22px;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.5}
.notice p{margin:0 auto;max-width:820px;text-wrap:balance}

/* ---------- layout ---------- */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
main.wrap{padding-bottom:130px}
.tools{display:flex;gap:16px;align-items:center;margin:26px 0 12px}
.sbox{position:relative;flex:1;min-width:0}
.sbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:21px;height:21px;color:var(--gold-dk);pointer-events:none}
.sbox input{width:100%;height:50px;padding:0 14px 0 48px;border:1px solid var(--hair);border-radius:3px;background:var(--paper);font:inherit;font-size:16px;font-weight:300;color:var(--ink)}
.sbox input:focus{border-color:var(--gold)}
.sbox input::placeholder{color:var(--mute)}
.tools span{color:var(--mute);font-size:14px;letter-spacing:.03em;white-space:nowrap}
.disc{font-size:12px;color:var(--mute);margin:0 0 6px;letter-spacing:.02em}

/* category tabs (phones: swipe row; wide screens: left list) */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:10px;overflow-x:auto;padding:12px 18px;margin:0 -18px 14px;background:var(--ivory);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--hair);background:transparent;border-radius:99px;padding:10px 24px;font-size:14.500px;font-weight:400;letter-spacing:.05em;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab small{display:none}
.tab[aria-pressed=true]{background:var(--wine);border-color:var(--gold);color:var(--gold-lt);font-weight:500}
@media(min-width:700px){
  .shopLayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
  .tabs{top:12px;flex-direction:column;overflow-x:hidden;overflow-y:auto;max-height:calc(100vh - 110px);margin:0;padding:8px;gap:2px;border:1px solid var(--hair);border-radius:4px;background:var(--paper)}
  .tab{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:2px;padding:10px 14px;text-align:left;white-space:normal;font-size:15px}
  .tab small{display:inline;margin-left:8px;opacity:.6;font-weight:300}
}

/* ---------- product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}}
.p{background:var(--paper);border:1px solid var(--hair);border-radius:4px;padding:8px;display:flex;flex-direction:column;box-shadow:0 14px 26px -22px rgba(74,10,28,.55)}
.p.gone{display:none}
.ph{position:relative;display:block;width:100%;aspect-ratio:6/5;background:#e9dfcb;border:0;padding:0;border-radius:2px;overflow:hidden;cursor:zoom-in}
.ph::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,236,190,.5);pointer-events:none}
.ph-none{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:14px;cursor:default;padding:12px}
.ph-none::after{display:none}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.pb{padding:14px 6px 6px;display:flex;flex-direction:column;gap:5px;flex:1}
.pb h3{font-size:22px;font-weight:700;line-height:1.1;color:var(--wine);min-height:2.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb small{color:var(--mute);font-size:13px;letter-spacing:.05em;min-height:1.3em;display:block}
.price{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:36px;margin:4px 0 8px}
.new{font-size:26px;font-weight:500;color:var(--price);line-height:1;letter-spacing:-.01em}
.old{text-decoration:line-through;color:var(--mute);font-size:14px;font-weight:300}
.off{border:1px solid rgba(44,106,72,.45);color:var(--green);font-size:11.500px;font-weight:500;letter-spacing:.06em;padding:3px 9px;border-radius:2px;white-space:nowrap}
.nop{color:var(--mute);font-size:14px;font-style:italic}
.qty{display:flex;margin-top:auto;border:1px solid var(--gold);border-radius:3px;overflow:hidden;background:var(--paper)}
.qty button{width:42px;height:42px;border:0;background:transparent;font-size:22px;font-weight:300;line-height:1;cursor:pointer;color:var(--wine)}
.qty input{flex:1;min-width:0;height:42px;text-align:center;border:0;border-left:1px solid var(--hair);border-right:1px solid var(--hair);border-radius:0;background:transparent;font:inherit;font-size:16px;font-weight:500;color:var(--ink);-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty.na{opacity:.45;pointer-events:none}
.empty{text-align:center;color:var(--mute);padding:30px 0;font-family:var(--serif);font-style:italic;font-size:20px}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(34,4,16,.97);border-top:1px solid var(--gold);box-shadow:0 -1px 0 rgba(239,217,160,.18),0 -12px 28px rgba(34,4,16,.25);padding:12px 0;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;gap:16px}
.sum{display:flex;flex-direction:column;line-height:1.25;padding-right:16px;border-right:1px solid rgba(201,162,77,.4);min-width:0}
#count{color:#fff;font-size:15px;font-weight:500;letter-spacing:.04em}
#barTotal{color:var(--gold-lt);font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
#barSave{color:var(--gold);font-size:11.500px;letter-spacing:.04em}
#barSave:empty{display:none}
#review{flex:1;white-space:nowrap}

/* ---------- buttons + review / done pages ---------- */
.btn{background:var(--foil);color:var(--night);border:1px solid #a58030;border-radius:3px;padding:15px 24px;font:inherit;font-size:14px;font-weight:600;letter-spacing:.16em;text-indent:.16em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(120,80,10,.3)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--wine);border:1px solid var(--gold);box-shadow:none;font-size:12px;letter-spacing:.1em}
.itemsHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 8px 12px}
.itemsHead .btn{padding:10px 16px}
.rq{margin:0 0 0 auto;width:120px}.rq button{width:34px;height:36px;font-size:18px}.rq input{height:36px;width:44px;flex:none;font-size:15px}
:focus-visible{outline:2px solid var(--gold-dk);outline-offset:2px}
.box{background:var(--paper);border:1px solid var(--hair);border-radius:4px;padding:18px;margin-bottom:16px}
.box h3{font-size:24px;color:var(--wine)}
#summary>h2,#done h2{font-size:34px;color:var(--wine)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--hair);font-size:15px}
th{color:var(--mute);font-weight:400;font-size:12.500px;letter-spacing:.08em}
.r{text-align:right}
.tot td{border:0;font-weight:600}
.save{color:var(--green)}
label{display:block;font-weight:500;margin:14px 0 4px;letter-spacing:.02em}
.f{width:100%;padding:12px;border:1px solid var(--hair);border-radius:3px;background:#fff;font:inherit;font-weight:300}
.f:focus{border-color:var(--gold);outline:0}
.minmsg{background:#fdecea;color:#8a1c14;border:1px solid #f5c2bd;border-radius:3px;padding:10px 12px;margin:0 0 12px;font-weight:500;font-size:14px;line-height:1.45}
.err{color:#b3261e;font-size:14px;margin-top:8px;min-height:20px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.hide{display:none!important}
.ok{text-align:center;padding:36px 10px}
.payqr{background:#f7eed7;border:1px solid var(--gold);outline:1px solid rgba(201,162,77,.35);outline-offset:4px;border-radius:2px;padding:16px;margin:22px 8px;text-align:center}
.payqr h3{margin:0 0 4px;font-size:24px}.payqr p{margin:0 0 10px}
.payqr img{max-width:100%;height:auto;border-radius:3px;background:#fff;padding:6px}
.lb{position:fixed;inset:0;background:rgba(20,4,10,.9);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:3px;border:1px solid var(--gold)}
.lb p{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.pad{padding-top:22px}
.deal{background:var(--green);color:#fff;font-weight:500;border-radius:3px;padding:12px 14px;margin-bottom:14px;text-align:center;letter-spacing:.02em}
.adv{display:flex;gap:10px;align-items:flex-start;background:#f7eed7;border:1px solid var(--hair);border-radius:3px;padding:12px;margin:14px 0 0;font-weight:500;cursor:pointer}
.adv input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--wine)}
.adv small{display:block;font-weight:300;color:var(--mute);margin-top:2px}
.noprice .price,.noprice .pcol{display:none!important}
.lv{position:fixed;inset:0;background:rgba(20,4,10,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:18px}
.lv .card{background:var(--paper);border:1px solid var(--gold);border-radius:4px;padding:22px 20px;max-width:380px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);text-align:center}
.lv h3{font-size:26px;color:var(--wine);margin:0 0 8px}
.lv p{margin:0 0 18px;color:var(--ink);line-height:1.5;font-size:15px}
.lv .btns{display:flex;flex-direction:column;gap:10px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--wine);color:var(--gold-lt);font-size:13px}
.tb .lg button{background:none;border:1px solid var(--gold);color:var(--gold-lt);border-radius:3px;padding:3px 10px;margin-left:4px;font-size:13px;cursor:pointer}
.tb .lg button[aria-pressed=true]{background:var(--gold);color:var(--night)}
.p.fav{border:2px solid var(--gold);order:-1}
.p.fav .ph{aspect-ratio:1/1}.p.fav .ph img{width:100%;height:100%;object-fit:cover}
.favb{display:inline-block;background:var(--foil);color:var(--night);font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;margin-bottom:4px}
.qpr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair)}
.qpr img{width:46px;height:46px;object-fit:cover;border-radius:3px}.qpr b{flex:1;font-weight:500;font-size:14px}
.qpr .btn{padding:6px 12px;font-size:13px}
</style>
</head>
<body>

<div class="strip">
  <svg viewBox="0 0 22 16" fill="currentColor" aria-hidden="true"><path d="M11 1c1.6 2.4 1.6 5.6 0 8-1.6-2.4-1.6-5.6 0-8zM3 5c3 .2 5.600 2 6.800 4.600C6.800 9.800 4 8.600 3 5zM19 5c-1 3.600-3.800 4.800-6.800 4.600C13.400 7 16 5.200 19 5zM11 11c3 0 5.200 1.600 6 4H5c.8-2.400 3-4 6-4z"/></svg>
  <span>Premium Diwali Collection</span>
  <svg viewBox="0 0 22 16" fill="currentColor" aria-hidden="true"><path d="M11 1c1.6 2.4 1.6 5.6 0 8-1.6-2.4-1.6-5.6 0-8zM3 5c3 .2 5.600 2 6.800 4.600C6.800 9.800 4 8.600 3 5zM19 5c-1 3.600-3.800 4.800-6.800 4.600C13.400 7 16 5.200 19 5zM11 11c3 0 5.200 1.600 6 4H5c.8-2.400 3-4 6-4z"/></svg>
</div>

<header class="top">
  <button class="ib" id="menuBtn" aria-label="Browse categories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <h1 class="logo">Shivakashi<span class="sub">Crackers</span></h1>
  <div class="acts">
    <button class="ib" id="searchBtn" aria-label="Search crackers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="7"/><path d="M16 16l5 5"/></svg>
    </button>
    <button class="ib" id="cartBtn" aria-label="Review order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.500 12h11L21 7H6"/><circle cx="9" cy="20" r="1.300"/><circle cx="17" cy="20" r="1.300"/></svg>
      <span class="badge hide" id="cartBadge">0</span>
    </button>
  </div>
</header>

<div class="diwali-hero">
  <div class="frame">
    <img src="banner.jpg?v=2" alt="Make This Diwali Brilliant — Shivakashi Crackers, up to 95% off">
    <canvas id="fx" aria-hidden="true"></canvas>
  </div>
</div>
<div id="hint" aria-live="polite"></div>

<div class="tb"><span id="closeMsg"></span><span class="lg" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">English</button><button data-l="kn" aria-pressed="false">ಕನ್ನಡ</button><button data-l="hi" aria-pressed="false">हिन्दी</button></span></div>
<div class="notice"><p data-i="notice"></p></div>

<main class="wrap">
  <!-- Page 1: products -->
  <section id="shop">
    <div class="tools">
      <div class="sbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.500" cy="10.500" r="7"/><path d="M16 16l5 5"/></svg>
        <input id="search" type="search" data-ip="search" aria-label="Search crackers">
      </div>
      <span id="shown"></span>
    </div>
    <p class="disc" data-i="disc"></p>
    <div class="shopLayout" id="layout">
      <div class="tabs" id="tabs" role="group" aria-label="Categories"></div>
      <div class="shopMain">
        <div class="grid" id="grid"></div>
        <p class="empty hide" id="empty">No items found.</p>
        <p class="note" id="loadErr"></p>
      </div>
    </div>
  </section>

  <!-- Page 2: order summary -->
  <section id="summary" class="hide pad">
    <h2 style="margin-bottom:14px" data-i="yourOrder"></h2>
    <div class="deal hide pcol" id="dealMsg"></div>
    <div class="box tw">
      <div class="itemsHead"><strong data-i="itemsH"></strong><button class="btn ghost" id="back" data-i="edit"></button></div>
      <table>
        <thead><tr><th data-i="thItem"></th><th class="r pcol" data-i="thPrice"></th><th class="r" data-i="thQty"></th><th class="r pcol" data-i="thAmt"></th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div>
    <div class="minmsg hide" id="minMsg" role="alert"></div>
    <div class="box hide" id="qp"><h3 data-i="qp"></h3><div id="qpRow"></div></div>
    <div class="box">
      <h3 data-i="delH"></h3>
      <label for="name" data-i="l_name"></label>
      <input class="f" id="name" autocomplete="name">
      <label for="phone" data-i="l_phone"></label>
      <input class="f" id="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" data-ip="phPh">
      <label for="addr" data-i="l_addr"></label>
      <textarea class="f" id="addr" rows="3" autocomplete="street-address"></textarea>
      <label for="city" data-i="l_city"></label>
      <select class="f" id="city" autocomplete="address-level2"><option value="Bengaluru" selected>Bengaluru (Bangalore)</option></select>
      <label for="state" data-i="l_state"></label>
      <select class="f" id="state" autocomplete="address-level1"><option value="Karnataka" selected>Karnataka</option></select>
      <label for="pin" data-i="l_pin"></label>
      <input class="f" id="pin" type="tel" inputmode="numeric" maxlength="6" autocomplete="postal-code" data-ip="pinPh">
      <p class="note" style="margin-top:6px" data-i="bangOnly"></p>
      <label class="adv" for="adv"><input type="checkbox" id="adv"><span><span id="advTxt"></span><small data-i="adv1s"></small></span></label>
      <label class="adv" for="adv2"><input type="checkbox" id="adv2"><span><span data-i="adv2"></span><small data-i="adv2s"></small></span></label>
      <div class="err" id="err" role="alert"></div>
      <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
        <button class="btn" id="submit" data-i="place"></button>
      </div>
      <p class="note" id="note"></p>
    </div>
  </section>

  <!-- Page 3: done -->
  <section id="done" class="hide pad">
    <div class="box ok">
      <h2 data-i="doneH"></h2>
      <p id="doneMsg"></p>
      <div class="payqr">
        <h3 id="payH"></h3>
        <p data-i="payP"></p>
        <img src="payment-qr.jpg" alt="Payment QR code" width="240">
      </div>
      <p><strong data-i="share"></strong></p>
      <button class="btn" id="again" data-i="again"></button>
    </div>
  </section>
</main>

function applyLang(){
  document.documentElement.lang = LANG;
  try{ localStorage.setItem("sc_lang", LANG); }catch(e){}
  document.querySelectorAll("[data-i]").forEach(el => el.innerHTML = t(el.dataset.i));
  document.querySelectorAll("[data-ip]").forEach(el => el.placeholder = t(el.dataset.ip));
  document.querySelectorAll(".lg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === LANG));
  if (PRODUCTS.length) renderGrid();
  updateBar(); renderClose();
  if (curPage === "summary") renderSummary();
  if (DONE) renderDone();
}
function renderClose(){
  const ms = ORDER_CLOSE - Date.now(), n = Math.ceil(ms / 864e5);
  $("closeMsg").textContent = ms <= 0 ? t("closedMsg") : (n <= 1 ? t("closeLast") : t("close", {n}));
  $("review").disabled = !items().length || closed();
  if ($("submit")) $("submit").disabled = closed() || $("submit").disabled;
}
function renderDone(){
  $("doneMsg").innerHTML = t("doneMsg", {o: DONE.o, p: DONE.p});
  $("payH").textContent = t("payH", {a: DONE.a});
}
document.querySelector(".lg").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ LANG = b.dataset.l; applyLang(); } });

  }
}

/* ---- read products.csv (edit it in Excel / Google Sheets) ---- */
function parseCSV(t){
  t = t.replace(/^\ufeff/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim())).map(r => {
    const o = {}; head.forEach((h, i) => o[h] = (r[i] || "").trim());
    const price = parseFloat(o.price) || 0, mrp = parseFloat(o.mrp) || 0;
    return {id:o.id, image:o.image, name:o.name, pack:o.pack, category:o.category || guessCat(o.name), favRaw:o.favorite || o.favourite || o.fav, hd:o.hd_image, price, mrp: mrp || price, disc: parseFloat(o.discount) || 0};
  });
}

/* If a product has no category in the sheet, guess the tab from its name */
function guessCat(name){
  const n = (name || "").toLowerCase();
  if (/skyshots|\bshots?\b/.test(n)) return "Skyshots";
  if (/rocket/.test(n)) return "Rockets";
  if (/bomb/.test(n)) return "Bombs";
  if (/gift/.test(n)) return "Gift Boxes";
  if (/sparkler/.test(n)) return "Sparklers";
  if (/crackling/.test(n)) return "Crackling";
  if (/smoke|fog/.test(n)) return "Smoke and Fog";
  if (/fountain|tri ?colou?r|shower/.test(n)) return "Fountains";
  if (/wheel|chakkar|spinner/.test(n)) return "Wheels";
  if (/flower ?pot|koti|\bpots?\b/.test(n)) return "Flower Pots";
  return "Fancy Item";
}

async function load(){
  // Prefer the live Google Sheet (if a link is set in config.js); fall back to products.csv
  const live = (typeof PRODUCTS_CSV_URL !== "undefined" && PRODUCTS_CSV_URL) ? PRODUCTS_CSV_URL : "";
  const sources = live ? [live, "products.csv"] : ["products.csv"];
  for (const src of sources){
    try{
      const r = await fetch(src, {cache:"no-store"});
      if (!r.ok) throw 0;
      const list = parseCSV(await r.text());
      if (!list.length || !list[0].name) throw 0;
      // cheapest first in every tab; products without a price go last (CSV order breaks ties)
      list.forEach((p, i) => p._i = i);
      list.sort((x, y) => ((x.price > 0) !== (y.price > 0) ? (x.price > 0 ? -1 : 1) : 0) || (x.price - y.price) || (x._i - y._i));
      PRODUCTS = list; renderGrid(); restoreSession(); return;
    }catch(e){}
  }
  $("loadErr").textContent = "Could not load the product list. Please refresh the page.";
}

/* ---- banner fireworks: rockets that go up and burst, plus rising sparks ----
   mode: "rockets" | "embers" | "both" | "none"                                */
function bannerFX(canvas, mode){
  if (!canvas || mode === "none") return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = canvas.getContext("2d"), COL = ["#ffd400","#ff3d71","#00e5ff","#7CFF4F","#ff9100","#ffffff","#d500f9"];
  let W = 0, H = 0, rockets = [], parts = [], last = performance.now(), nextR = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function size(){
    const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    W = r.width; H = r.height; canvas.width = W * d; canvas.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  size(); window.addEventListener("resize", size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(canvas.parentElement);
  const useR = mode === "rockets" || mode === "both", useE = mode === "embers" || mode === "both";
  function burst(x, y, c){
    const n = 46;
    for (let i = 0; i < n; i++){
      const a = (i / n) * Math.PI * 2 + rnd(-.1, .1), s = rnd(1.2, 3.6) * (H / 400 + .5);
      parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, dec: rnd(.012, .022), g: .035, r: rnd(1.2, 2.4), c});
    }
  }
  function frame(now){
    const k = Math.min(3, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = "lighter";
    if (useR && now > nextR){
      rockets.push({x: rnd(W * .06, W * .94), y: H + 6, ty: rnd(H * .12, H * .55), v: rnd(.011, .016) * H, c: COL[(Math.random() * COL.length) | 0]});
      nextR = now + rnd(350, 900);
    }
    if (useE && Math.random() < .5 * k)
      parts.push({x: rnd(0, W), y: H + 4, vx: rnd(-.3, .3), vy: -rnd(.8, 2.2), life: 1, dec: rnd(.004, .009), g: 0, r: rnd(1, 2.2), c: COL[(Math.random() * COL.length) | 0], ember: 1});
    rockets = rockets.filter(r => {
      r.y -= r.v * k;
      parts.push({x: r.x + rnd(-1, 1), y: r.y + 4, vx: rnd(-.2, .2), vy: rnd(.3, 1), life: .8, dec: .06, g: 0, r: 1.6, c: "#ffb74d"});
      ctx.fillStyle = "#fff"; ctx.shadowBlur = 12; ctx.shadowColor = r.c;
      ctx.beginPath(); ctx.arc(r.x, r.y, 2.6, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      if (r.y <= r.ty){ burst(r.x, r.y, r.c); return false; }
      return true;
    });
    parts = parts.filter(p => {
      p.x += p.vx * k; p.y += p.vy * k; p.vy += p.g * k; if (p.ember) p.x += Math.sin(p.y / 18) * .3;
      p.life -= p.dec * k; if (p.life <= 0) return false;
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); return true;
    });
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---- keep the cart between visits ----
   The cart and delivery details are saved on the customer's own phone/browser.
   If nobody touches the page for SESSION_HOURS, the cart empties itself.
   Change the number below (24 = one day, 6 = six hours, 0.5 = half an hour). */
const SESSION_HOURS = 24;
const SESSION_KEY = "sc_session_v1", SESSION_MS = SESSION_HOURS * 3600 * 1000;
const FORM_IDS = ["name","phone","addr","pin"];
let lastActive = Date.now(), lastWrite = 0;

function saveSession(force){
  try{
    if (curPage === "done") return;
    const q = {}; items().forEach(p => q[p.id] = cart[p.id]);
    const form = {}; FORM_IDS.forEach(i => form[i] = $(i).value);
    if (!Object.keys(q).length && !FORM_IDS.some(i => form[i].trim())) { localStorage.removeItem(SESSION_KEY); return; }
    lastWrite = Date.now();
    localStorage.setItem(SESSION_KEY, JSON.stringify({t: lastActive, cart: q, form}));
  }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

function restoreSession(){
  try{
    const d = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    if (!d) return;
    if (Date.now() - d.t > SESSION_MS) return clearSession();
    PRODUCTS.forEach(p => { if (d.cart && d.cart[p.id] > 0) cart[p.id] = Math.min(999, d.cart[p.id]); });
    FORM_IDS.forEach(i => { if (d.form && d.form[i]) $(i).value = d.form[i]; });
    lastActive = Date.now();
    renderGrid(); updateBar();
  }catch(e){}
}

// idle clock: any tap, key or typing counts as activity
function touch(){
  lastActive = Date.now();
  if (lastActive - lastWrite > 5000) saveSession();
}
["pointerdown","keydown","input","scroll"].forEach(ev => document.addEventListener(ev, touch, {passive:true, capture:true}));

// if the page stays open and idle past the limit, empty the cart
function checkIdle(){
  if (curPage === "done" || Date.now() - lastActive <= SESSION_MS) return;
  if (!items().length && !FORM_IDS.some(i => $(i).value.trim())) return;
  $("again").onclick();   // same reset as "Start a new order"
  clearSession();
}
setInterval(checkIdle, 60000);
